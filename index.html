<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MudassirTok - Complete</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff0050;
            --secondary: #00f2ea;
            --dark: #000;
            --dark2: #111;
            --dark3: #1a1a1a;
            --dark4: #2a2a2a;
            --text: #fff;
            --text2: #888;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .app-container {
            max-width: 430px;
            height: 100vh;
            margin: 0 auto;
            background: var(--dark);
            position: relative;
            overflow: hidden;
        }

        /* ===== AUTH ===== */
        .auth-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            max-width: 430px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
            animation: fadeIn 0.5s ease;
        }

        .auth-screen.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        .auth-screen .logo {
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--primary));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .auth-screen .subtitle {
            color: var(--text2);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .auth-screen .auth-box {
            width: 100%;
            max-width: 340px;
        }

        .auth-screen input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: var(--dark3);
            border: 2px solid var(--dark4);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .auth-screen input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 0, 80, 0.15);
            background: var(--dark2);
        }

        .auth-screen .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            border: none;
            border-radius: 14px;
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .auth-screen .auth-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.3);
        }

        .auth-screen .auth-btn.secondary {
            background: transparent;
            border: 2px solid var(--dark4);
            margin-top: 8px;
        }

        .auth-screen .auth-btn.secondary:hover {
            border-color: var(--primary);
            background: rgba(255, 0, 80, 0.05);
        }

        .auth-screen .auth-switch {
            color: var(--text2);
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
        }

        .auth-screen .auth-switch span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            transition: color 0.3s;
        }

        .auth-screen .auth-switch span:hover {
            color: #ff2d55;
            text-decoration: underline;
        }

        /* ===== MAIN APP ===== */
        .main-app {
            display: none;
            height: 100vh;
            position: relative;
        }

        .main-app.active {
            display: block;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 430px;
            margin: 0 auto;
            pointer-events: none;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--primary));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            letter-spacing: -0.5px;
        }

        .header .header-icons {
            display: flex;
            gap: 18px;
            pointer-events: auto;
            font-size: 20px;
        }

        .header .header-icons i {
            cursor: pointer;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            transition: all 0.2s;
        }

        .header .header-icons i:active {
            transform: scale(0.85);
        }

        /* ===== FEED TABS ===== */
        .feed-tabs {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            z-index: 99;
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 430px;
            margin: 0 auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feed-tabs .tab {
            background: none;
            border: none;
            color: var(--text2);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
            transition: all 0.3s;
            position: relative;
            font-family: inherit;
        }

        .feed-tabs .tab.active {
            color: var(--text);
        }

        .feed-tabs .tab.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 24px;
                opacity: 1;
            }
        }

        .feed-tabs .tab:hover {
            color: var(--text);
        }

        /* ===== FEED ===== */
        .feed-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            padding-top: 105px;
        }

        .feed-container::-webkit-scrollbar {
            display: none;
        }

        /* ===== VIDEO ITEM ===== */
        .video-item {
            height: calc(100vh - 105px);
            min-height: 600px;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            background: var(--dark2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--dark);
        }

        .video-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ===== LIVE BADGE ===== */
        .live-badge {
            position: absolute;
            top: 80px;
            left: 16px;
            z-index: 10;
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: livePulse 2s infinite;
            box-shadow: 0 4px 20px rgba(255, 0, 80, 0.4);
        }

        .live-badge .live-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: dotPulse 1s infinite;
        }

        @keyframes livePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* ===== HD BADGE ===== */
        .hd-badge {
            position: absolute;
            top: 80px;
            right: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            color: var(--secondary);
            border: 1px solid rgba(0, 242, 234, 0.2);
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* ===== VIDEO INFO ===== */
        .video-info {
            position: absolute;
            bottom: 100px;
            left: 16px;
            right: 80px;
            z-index: 10;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        .video-info .username {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .video-info .username:hover {
            opacity: 0.8;
        }

        .video-info .username .badge {
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .video-info .description {
            font-size: 15px;
            opacity: 0.95;
            line-height: 1.5;
            margin-top: 2px;
        }

        .video-info .music {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .video-info .music:hover {
            opacity: 1;
        }

        .video-info .music i {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== ACTIONS ===== */
        .actions {
            position: absolute;
            right: 12px;
            bottom: 100px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .actions .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.2s;
            background: none;
            border: none;
            color: var(--text);
            padding: 0;
            position: relative;
        }

        .actions .action-btn:active {
            transform: scale(0.85);
        }

        .actions .action-btn .icon {
            font-size: 28px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            transition: all 0.3s;
        }

        .actions .action-btn .count {
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .actions .action-btn .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2.5px solid var(--text);
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            cursor: pointer;
        }

        .actions .action-btn .avatar:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .actions .action-btn.liked .icon {
            color: var(--primary);
            animation: likeAnimation 0.4s ease;
        }

        @keyframes likeAnimation {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
            100% {
                transform: scale(1);
            }
        }

        .actions .action-btn .follow-btn {
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            border: none;
            color: var(--text);
            font-size: 10px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 2px;
            box-shadow: 0 4px 15px rgba(255, 0, 80, 0.3);
        }

        .actions .action-btn .follow-btn:active {
            transform: scale(0.9);
        }

        .actions .action-btn .follow-btn.following {
            background: var(--dark4);
            box-shadow: none;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 6px 0 env(safe-area-inset-bottom);
            max-width: 430px;
            margin: 0 auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: none;
            border: none;
            color: var(--text2);
            font-size: 10px;
            cursor: pointer;
            padding: 4px 12px;
            transition: all 0.3s;
            font-weight: 500;
            font-family: inherit;
        }

        .bottom-nav .nav-item i {
            font-size: 24px;
            transition: all 0.3s;
        }

        .bottom-nav .nav-item.active {
            color: var(--text);
        }

        .bottom-nav .nav-item .upload-icon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -24px;
            font-size: 26px;
            color: var(--text);
            box-shadow: 0 4px 30px rgba(255, 0, 80, 0.4);
            transition: all 0.3s;
        }

        .bottom-nav .nav-item .upload-icon:active {
            transform: scale(0.9);
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 430px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--dark3);
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 400px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-content .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-content .close-modal {
            background: none;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            transition: transform 0.3s;
        }

        .modal-content .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            background: var(--dark4);
            border: 2px solid #333;
            border-radius: 14px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .modal-content input:focus,
        .modal-content textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 0, 80, 0.1);
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-content input[type="file"] {
            background: transparent;
            border: 2px dashed var(--dark4);
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-content input[type="file"]:hover {
            border-color: var(--primary);
            background: rgba(255, 0, 80, 0.05);
        }

        .modal-content .upload-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            border: none;
            border-radius: 14px;
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-content .upload-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.3);
        }

        /* ===== COMMENTS ===== */
        .comments-section {
            max-height: 300px;
            overflow-y: auto;
            margin: 12px 0;
            padding-right: 8px;
        }

        .comments-section::-webkit-scrollbar {
            width: 4px;
        }

        .comments-section::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.3s ease;
        }

        .comment-item .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--dark4);
            flex-shrink: 0;
            object-fit: cover;
        }

        .comment-item .comment-body {
            flex: 1;
        }

        .comment-item .comment-body .comment-username {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
        }

        .comment-item .comment-body .comment-text {
            font-size: 14px;
            opacity: 0.95;
            margin-top: 2px;
        }

        .comment-item .comment-body .comment-time {
            font-size: 11px;
            color: var(--text2);
            margin-top: 2px;
        }

        .comment-input-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .comment-input-row input {
            flex: 1;
            padding: 10px 16px;
            background: var(--dark4);
            border: 2px solid #333;
            border-radius: 24px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .comment-input-row input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .comment-input-row button {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            border: none;
            border-radius: 24px;
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .comment-input-row button:hover {
            transform: scale(1.05);
        }

        /* ===== PROFILE ===== */
        .profile-header {
            text-align: center;
            padding: 10px 0 20px;
        }

        .profile-header .profile-avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 12px;
            cursor: pointer;
        }

        .profile-header .profile-avatar-wrapper .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            object-fit: cover;
            transition: all 0.3s;
        }

        .profile-header .profile-avatar-wrapper .profile-avatar:hover {
            transform: scale(1.05);
            border-color: var(--secondary);
        }

        .profile-header .profile-avatar-wrapper .edit-avatar-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--dark3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .profile-header .profile-avatar-wrapper .edit-avatar-overlay:hover {
            transform: scale(1.1);
            background: var(--secondary);
        }

        .profile-header .profile-avatar-wrapper .edit-avatar-overlay i {
            font-size: 14px;
        }

        .profile-header .profile-name {
            font-size: 22px;
            font-weight: 700;
        }

        .profile-header .profile-username {
            color: var(--text2);
            font-size: 14px;
            margin-top: 2px;
        }

        .profile-header .profile-bio {
            color: #aaa;
            font-size: 14px;
            margin-top: 6px;
            padding: 0 20px;
        }

        .profile-header .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 16px 0;
        }

        .profile-header .profile-stats div {
            text-align: center;
        }

        .profile-header .profile-stats .num {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .profile-header .profile-stats .label {
            font-size: 12px;
            color: var(--text2);
            margin-top: 2px;
        }

        .profile-header .profile-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .profile-header .profile-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .profile-header .profile-actions button:hover {
            transform: scale(1.05);
        }

        .profile-header .profile-actions .follow-btn-pro {
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            color: var(--text);
            box-shadow: 0 4px 20px rgba(255, 0, 80, 0.3);
        }

        .profile-header .profile-actions .follow-btn-pro.following {
            background: var(--dark4);
            box-shadow: none;
        }

        .profile-header .profile-actions .edit-btn {
            background: var(--dark4);
            color: var(--text);
        }

        .profile-header .profile-actions .message-btn {
            background: var(--secondary);
            color: var(--dark);
        }

        .profile-header .profile-actions .logout-btn {
            background: transparent;
            border: 2px solid var(--dark4);
            color: var(--primary);
        }

        .profile-header .profile-actions .logout-btn:hover {
            border-color: var(--primary);
            background: rgba(255, 0, 80, 0.05);
        }

        .profile-videos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 0 4px;
        }

        .profile-videos .profile-video-thumb {
            aspect-ratio: 1;
            background: var(--dark4);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .profile-videos .profile-video-thumb:hover {
            transform: scale(1.02);
            z-index: 1;
        }

        .profile-videos .profile-video-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-videos .profile-video-thumb .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            opacity: 0.7;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        .profile-videos .profile-video-thumb .video-views {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 8px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }

        /* ===== SEARCH ===== */
        .search-container {
            padding: 16px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px;
            background: var(--dark4);
            border: 2px solid #333;
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 0, 80, 0.1);
        }

        .search-results {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .search-results .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--dark3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-results .search-item:hover {
            background: var(--dark4);
            transform: translateX(4px);
        }

        .search-results .search-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .search-results .search-item .search-name {
            font-weight: 600;
        }

        .search-results .search-item .search-username {
            color: var(--text2);
            font-size: 13px;
        }

        /* ===== NOTIFICATIONS ===== */
        .notification-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--dark3);
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .notification-item:hover {
            background: var(--dark4);
        }

        .notification-item .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .notification-item .notif-text {
            flex: 1;
            font-size: 14px;
        }

        .notification-item .notif-time {
            font-size: 11px;
            color: var(--text2);
        }

        /* ===== INBOX / MESSAGES ===== */
        .inbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--dark3);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .inbox-item:hover {
            background: var(--dark4);
            transform: translateX(4px);
        }

        .inbox-item img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .inbox-item .inbox-info {
            flex: 1;
        }

        .inbox-item .inbox-info .inbox-name {
            font-weight: 600;
        }

        .inbox-item .inbox-info .inbox-msg {
            font-size: 13px;
            color: var(--text2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== MESSAGE THREAD ===== */
        .message-thread {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px 0;
        }

        .message-thread::-webkit-scrollbar {
            width: 4px;
        }

        .message-thread::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message-bubble.sent {
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message-bubble.received {
            background: var(--dark4);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-bubble .msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            display: block;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            color: var(--text);
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow);
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 60vh;
            color: var(--text2);
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state h3 {
            color: var(--text);
            margin-bottom: 8px;
            font-size: 20px;
        }

        .empty-state p {
            color: var(--text2);
            font-size: 14px;
            max-width: 280px;
            line-height: 1.5;
        }

        .empty-state .empty-btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--primary), #ff2d55);
            border: none;
            border-radius: 24px;
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .empty-state .empty-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.3);
        }

        /* ===== VIDEO PROGRESS ===== */
        .video-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 5;
        }

        .video-progress .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.1s linear;
        }

        /* ===== DOUBLE TAP LIKE ===== */
        .heart-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: var(--primary);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: heartBurst 0.8s ease forwards;
        }

        @keyframes heartBurst {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 430px) {
            .app-container,
            .auth-screen,
            .modal-overlay {
                max-width: 100%;
            }
            .header {
                max-width: 100%;
                padding: 10px 12px;
            }
            .feed-tabs {
                max-width: 100%;
                top: 56px;
                gap: 24px;
            }
            .bottom-nav {
                max-width: 100%;
            }
            .video-info {
                bottom: 90px;
                left: 12px;
                right: 70px;
            }
            .video-info .username {
                font-size: 16px;
            }
            .video-info .description {
                font-size: 14px;
            }
            .actions {
                right: 8px;
                bottom: 90px;
                gap: 14px;
            }
            .actions .action-btn .icon {
                font-size: 24px;
            }
            .actions .action-btn .avatar {
                width: 44px;
                height: 44px;
            }
            .bottom-nav .nav-item .upload-icon {
                width: 48px;
                height: 48px;
                font-size: 22px;
                margin-top: -22px;
            }
            .profile-header .profile-avatar-wrapper {
                width: 80px;
                height: 80px;
            }
            .profile-header .profile-avatar-wrapper .profile-avatar {
                width: 80px;
                height: 80px;
            }
            .profile-header .profile-stats {
                gap: 24px;
            }
            .toast {
                bottom: 80px;
                max-width: 320px;
                font-size: 13px;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== AUTH SCREEN ===== -->
    <div class="auth-screen" id="authScreen">
        <div class="logo">♬ MudassirTok</div>
        <div class="subtitle">Share your world, one video at a time ✨</div>

        <div class="auth-box">
            <div id="authForm">
                <input type="text" id="authName" placeholder="Full Name" required>
                <input type="text" id="authUsername" placeholder="Username" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                <button class="auth-btn" id="authSubmitBtn">Create Account</button>
                <button class="auth-btn secondary" id="authSwitchBtn">Already have an account? Log in</button>
            </div>
            <div class="auth-switch" id="authSwitchText">
                <span id="authSwitchLink">Already have an account? Log in</span>
            </div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div class="main-app" id="mainApp">

        <div class="header">
            <h1>♬ MudassirTok</h1>
            <div class="header-icons">
                <i class="fas fa-search" onclick="openSearch()"></i>
                <i class="fas fa-plus-circle" onclick="openUploadModal()"></i>
                <i class="fas fa-user" onclick="openProfile()"></i>
                <i class="fas fa-envelope" onclick="openInbox()"></i>
            </div>
        </div>

        <div class="feed-tabs">
            <button class="tab active" data-tab="for-you" onclick="switchTab('for-you')">For You</button>
            <button class="tab" data-tab="following" onclick="switchTab('following')">Following</button>
            <button class="tab" data-tab="live" onclick="switchTab('live')">LIVE</button>
        </div>

        <div class="feed-container" id="feedContainer">
        </div>

        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('for-you')"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" onclick="openSearch()"><i class="fas fa-search"></i><span>Search</span></button>
            <button class="nav-item" onclick="openUploadModal()">
                <div class="upload-icon"><i class="fas fa-plus"></i></div>
                <span>Upload</span>
            </button>
            <button class="nav-item" onclick="openInbox()"><i class="fas fa-envelope"></i><span>Inbox</span></button>
            <button class="nav-item" onclick="openNotifications()"><i class="fas fa-bell"></i><span>Activity</span></button>
        </div>
    </div>

    <!-- ===== UPLOAD MODAL ===== -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📹 Upload Video</h2>
                <button class="close-modal" onclick="closeUploadModal()">&times;</button>
            </div>
            <form id="uploadForm" onsubmit="handleUpload(event)">
                <input type="file" id="videoFile" accept="video/*" required>
                <input type="text" id="descInput" placeholder="Write a caption..." maxlength="150">
                <input type="text" id="musicInput" placeholder="Add music name (optional)" value="🎵 Original Audio">
                <button type="submit" class="upload-btn"><i class="fas fa-cloud-upload-alt"></i> Upload Video</button>
            </form>
        </div>
    </div>

    <!-- ===== COMMENTS MODAL ===== -->
    <div class="modal-overlay" id="commentsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💬 Comments</h2>
                <button class="close-modal" onclick="closeCommentsModal()">&times;</button>
            </div>
            <div class="comments-section" id="commentsSection"></div>
            <div class="comment-input-row">
                <input type="text" id="commentInput" placeholder="Add a comment..." maxlength="200">
                <button onclick="postComment()">Post</button>
            </div>
        </div>
    </div>

    <!-- ===== PROFILE MODAL ===== -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2>👤 Profile</h2>
                <button class="close-modal" onclick="closeProfile()">&times;</button>
            </div>
            <div id="profileContent"></div>
        </div>
    </div>

    <!-- ===== SEARCH MODAL ===== -->
    <div class="modal-overlay" id="searchModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2>🔍 Search</h2>
                <button class="close-modal" onclick="closeSearch()">&times;</button>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search users..." oninput="performSearch()">
                <div class="search-results" id="searchResults">
                    <div style="text-align:center;color:var(--text2);padding:20px;">Search for users by username</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== INBOX / MESSAGES MODAL ===== -->
    <div class="modal-overlay" id="inboxModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2>📥 Inbox</h2>
                <button class="close-modal" onclick="closeInbox()">&times;</button>
            </div>
            <div id="inboxContent"></div>
        </div>
    </div>

    <!-- ===== MESSAGE THREAD MODAL ===== -->
    <div class="modal-overlay" id="messageModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2 id="messageHeader">💬 Chat</h2>
                <button class="close-modal" onclick="closeMessageModal()">&times;</button>
            </div>
            <div class="message-thread" id="messageThread"></div>
            <div class="comment-input-row" style="margin-top:8px;">
                <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500">
                <button onclick="sendDirectMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- ===== NOTIFICATIONS MODAL ===== -->
    <div class="modal-overlay" id="notificationsModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2>🔔 Activity</h2>
                <button class="close-modal" onclick="closeNotifications()">&times;</button>
            </div>
            <div id="notificationsContent"></div>
        </div>
    </div>

    <!-- ===== AVATAR UPLOAD ===== -->
    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">

    <script>
        // ============================================================
        //  MUDASSIRTOK - COMPLETE WITH AUDIO & DIRECT MESSAGES
        // ============================================================

        // ===== DATA LAYER =====
        const DB = {
            getUsers() {
                return JSON.parse(localStorage.getItem('mudassirtok_users') || '[]');
            },
            setUsers(users) {
                localStorage.setItem('mudassirtok_users', JSON.stringify(users));
            },
            getVideos() {
                return JSON.parse(localStorage.getItem('mudassirtok_videos') || '[]');
            },
            setVideos(videos) {
                localStorage.setItem('mudassirtok_videos', JSON.stringify(videos));
            },
            getComments() {
                return JSON.parse(localStorage.getItem('mudassirtok_comments') || '{}');
            },
            setComments(comments) {
                localStorage.setItem('mudassirtok_comments', JSON.stringify(comments));
            },
            getLikes() {
                return JSON.parse(localStorage.getItem('mudassirtok_likes') || '{}');
            },
            setLikes(likes) {
                localStorage.setItem('mudassirtok_likes', JSON.stringify(likes));
            },
            getFollows() {
                return JSON.parse(localStorage.getItem('mudassirtok_follows') || '{}');
            },
            setFollows(follows) {
                localStorage.setItem('mudassirtok_follows', JSON.stringify(follows));
            },
            getNotifications() {
                return JSON.parse(localStorage.getItem('mudassirtok_notifications') || '[]');
            },
            setNotifications(notifications) {
                localStorage.setItem('mudassirtok_notifications', JSON.stringify(notifications));
            },
            getMessages() {
                return JSON.parse(localStorage.getItem('mudassirtok_messages') || '{}');
            },
            setMessages(messages) {
                localStorage.setItem('mudassirtok_messages', JSON.stringify(messages));
            },
            getInbox() {
                return JSON.parse(localStorage.getItem('mudassirtok_inbox') || '[]');
            },
            setInbox(inbox) {
                localStorage.setItem('mudassirtok_inbox', JSON.stringify(inbox));
            },
            getLives() {
                return JSON.parse(localStorage.getItem('mudassirtok_lives') || '[]');
            },
            setLives(lives) {
                localStorage.setItem('mudassirtok_lives', JSON.stringify(lives));
            },
            getCurrentUser() {
                return JSON.parse(localStorage.getItem('mudassirtok_current_user') || 'null');
            },
            setCurrentUser(user) {
                localStorage.setItem('mudassirtok_current_user', JSON.stringify(user));
            },
            getNextId() {
                const id = parseInt(localStorage.getItem('mudassirtok_id') || '0');
                localStorage.setItem('mudassirtok_id', String(id + 1));
                return id + 1;
            }
        };

        // ===== STATE =====
        let currentUser = null;
        let currentTab = 'for-you';
        let commentVideoId = null;
        let allVideos = [];
        let observer = null;
        let viewCounts = {};
        let liveStreams = [];
        let isLiveStreaming = false;
        let liveInterval = null;
        let currentMessageUserId = null;

        // ===== AUTH =====
        function initAuth() {
            const user = DB.getCurrentUser();
            if (user) {
                currentUser = user;
                showMainApp();
            } else {
                showAuthScreen();
            }
            setupAuthListeners();
        }

        function showAuthScreen() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.remove('active');
        }

        function showMainApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('active');
            loadFeed();
            updateNav();
        }

        function updateNav() {
            document.querySelectorAll('.bottom-nav .nav-item').forEach((item, index) => {
                item.classList.toggle('active', index === 0);
            });
        }

        function setupAuthListeners() {
            let isLogin = false;

            document.getElementById('authSubmitBtn').addEventListener('click', (e) => {
                e.preventDefault();
                const name = document.getElementById('authName').value.trim();
                const username = document.getElementById('authUsername').value.trim().toLowerCase();
                const password = document.getElementById('authPassword').value.trim();

                if (!name || !username || !password) {
                    showToast('⚠️ Please fill in all fields');
                    return;
                }

                if (username.length < 3) {
                    showToast('⚠️ Username must be at least 3 characters');
                    return;
                }

                if (password.length < 4) {
                    showToast('⚠️ Password must be at least 4 characters');
                    return;
                }

                if (isLogin) {
                    const users = DB.getUsers();
                    const user = users.find(u => u.username === username && u.password === password);
                    if (!user) {
                        showToast('❌ Invalid username or password');
                        return;
                    }
                    currentUser = user;
                    DB.setCurrentUser(user);
                    showToast('✅ Welcome back, ' + user.name + '!');
                    showMainApp();
                } else {
                    const users = DB.getUsers();
                    if (users.find(u => u.username === username)) {
                        showToast('❌ Username already taken');
                        return;
                    }
                    const newUser = {
                        id: DB.getNextId(),
                        name: name,
                        username: username,
                        password: password,
                        avatar: 'https://i.pravatar.cc/300?img=' + DB.getNextId(),
                        bio: '🎬 Welcome to MudassirTok!',
                        joined: new Date().toISOString()
                    };
                    users.push(newUser);
                    DB.setUsers(users);
                    currentUser = newUser;
                    DB.setCurrentUser(newUser);

                    addWelcomeVideo(newUser.username);

                    showToast('🎉 Account created! Welcome to MudassirTok!');
                    showMainApp();
                }
            });

            document.getElementById('authSwitchBtn').addEventListener('click', () => {
                isLogin = !isLogin;
                const btn = document.getElementById('authSubmitBtn');
                const switchBtn = document.getElementById('authSwitchBtn');
                const nameInput = document.getElementById('authName');
                const switchText = document.getElementById('authSwitchText');

                if (isLogin) {
                    btn.textContent = 'Log In';
                    switchBtn.textContent = 'Create new account';
                    switchText.innerHTML = "Don't have an account? <span id='authSwitchLink'>Sign up</span>";
                    nameInput.style.display = 'none';
                } else {

        // ===== VIDEO PLAYBACK WITH AUDIO =====
        function setupVideoPlayback() {
            if (observer) observer.disconnect();

            const container = document.getElementById('feedContainer');
            const videoItems = container.querySelectorAll('.video-item');

            const options = {
                root: container,
                rootMargin: '0px',
                threshold: 0.6
            };

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const progress = entry.target.querySelector('.progress-bar');
                    if (!video) return;

                    if (entry.isIntersecting) {
                        // Play with audio
                        video.muted = false;
                        video.volume = 0.5;
                        video.play().catch(e => console.log('Autoplay blocked:', e));

                        // Show audio indicator
                        const videoId = parseInt(entry.target.dataset.videoId);
                        if (videoId) {
                            const indicator = document.getElementById(`audioIndicator-${videoId}`);
                            if (indicator) {
                                indicator.style.opacity = '0.3';
                                setTimeout(() => {
                                    indicator.style.opacity = '0';
                                }, 1500);
                            }
                            if (!viewCounts[videoId]) {
                                viewCounts[videoId] = true;
                                trackView(videoId);
                            }
                        }
                    } else {
                        video.pause();
                    }
                });
            }, options);

            videoItems.forEach(item => observer.observe(item));

            videoItems.forEach(item => {
                const video = item.querySelector('video');
                const progress = item.querySelector('.progress-bar');
                if (video && progress) {
                    video.addEventListener('timeupdate', () => {
                        if (video.duration) {
                            const pct = (video.currentTime / video.duration) * 100;
                            progress.style.width = pct + '%';
                        }
                    });
                }
            });

            container.addEventListener('scroll', () => {
                const items = container.querySelectorAll('.video-item');
                let bestItem = null;
                let bestRatio = 0;

                items.forEach(item => {
                    const rect = item.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    const visibleHeight = Math.min(rect.bottom, containerRect.bottom) - Math.max(rect.top,
                    containerRect.top);
                    const ratio = visibleHeight / rect.height;
                    if (ratio > bestRatio) {
                        bestRatio = ratio;
                        bestItem = item;
                    }
                });

                if (bestItem && bestRatio > 0.3) {
                    const video = bestItem.querySelector('video');
                    if (video && video.paused) {
                        video.muted = false;
                        video.volume = 0.5;
                        video.play().catch(e => {});
                    }
                }
            }, { passive: true });
        }

        // ===== TRACK VIEWS =====
        function trackView(videoId) {
            const videos = DB.getVideos();
            const video = videos.find(v => v.id === videoId);
            if (video) {
                video.views = (video.views || 0) + 1;
                DB.setVideos(videos);
                allVideos = videos;
            }
        }

        // ===== TAB SWITCHING =====
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.feed-tabs .tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            document.querySelectorAll('.bottom-nav .nav-item').forEach((item, index) => {
                item.classList.toggle('active', index === 0);
            });
            loadFeed();
        }

        // ===== LIKE =====
        function toggleLike(videoId) {
            if (!currentUser) {
                showToast('⚠️ Please login to like');
                return;
            }

            const likes = DB.getLikes();
            if (!likes[currentUser.id]) {
                likes[currentUser.id] = [];
            }

            const index = likes[currentUser.id].indexOf(videoId);
            let liked = false;
            if (index > -1) {
                likes[currentUser.id].splice(index, 1);
            } else {
                likes[currentUser.id].push(videoId);
                liked = true;
                addNotification(currentUser.id, videoId, 'liked');
            }

            DB.setLikes(likes);

            const count = getLikeCount(videoId);
            const countEl = document.getElementById(`likeCount-${videoId}`);
            if (countEl) countEl.textContent = count;

            const btn = document.querySelector(`.action-btn[data-video-id="${videoId}"]`);
            if (btn) {
                btn.classList.toggle('liked');
            }
        }

        function getLikeCount(videoId) {
            const likes = DB.getLikes();
            let count = 0;
            for (const userId in likes) {
                if (likes[userId].includes(videoId)) count++;
            }
            return count;
        }

        // ===== FOLLOW =====
        function toggleFollow(userId) {
            if (!currentUser) {
                showToast('⚠️ Please login to follow');
                return;
            }
            if (userId === currentUser.id) {
                showToast('You can\'t follow yourself 😄');
                return;
            }

            const follows = DB.getFollows();
            if (!follows[currentUser.id]) {
                follows[currentUser.id] = [];
            }

            const index = follows[currentUser.id].indexOf(userId);
            if (index > -1) {
                follows[currentUser.id].splice(index, 1);
                showToast('Unfollowed user');
            } else {
                follows[currentUser.id].push(userId);
                showToast('✅ Following!');
                addNotification(userId, null, 'followed');
            }

            DB.setFollows(follows);
            renderFeed();

            if (document.getElementById('profileModal').classList.contains('active')) {
                viewProfile(userId);
            }
        }

        function isUserFollowing(followerId, followeeId) {
            if (!followerId) return false;
            const follows = DB.getFollows();
            return follows[followerId] && follows[followerId].includes(followeeId);
        }

        function getFollowerCount(userId) {
            const follows = DB.getFollows();
            let count = 0;
            for (const key in follows) {
                if (follows[key].includes(userId)) count++;
            }
            return count;
        }

        function getFollowingCount(userId) {
            const follows = DB.getFollows();
            return (follows[userId] || []).length;
        }

        // ===== DIRECT MESSAGES =====
        function openDirectMessage(userId) {
            if (!currentUser) {
                showToast('⚠️ Please login first');
                return;
            }
            currentMessageUserId = userId;
            const users = DB.getUsers();
            const user = users.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('messageHeader').textContent = `💬 @${user.username}`;
            document.getElementById('messageModal').classList.add('active');
            renderMessages(userId);
            setTimeout(() => {
                document.getElementById('messageInput').focus();
            }, 300);
        }

        function closeMessageModal() {
            document.getElementById('messageModal').classList.remove('active');
            currentMessageUserId = null;
        }

        function renderMessages(userId) {
            const messages = DB.getMessages();
            const thread = document.getElementById('messageThread');

            const key1 = `${currentUser.id}-${userId}`;
            const key2 = `${userId}-${currentUser.id}`;
            const msgs = messages[key1] || messages[key2] || [];

            if (msgs.length === 0) {
                thread.innerHTML = `
                    <div style="text-align:center;color:var(--text2);padding:30px 0;">
                        <i class="fas fa-comment-dots" style="font-size:30px;opacity:0.3;"></i>
                        <p style="margin-top:10px;font-size:14px;">No messages yet. Say hi! 👋</p>
                    </div>
                `;
                return;
            }

            thread.innerHTML = msgs.map(m => `
                <div class="message-bubble ${m.senderId === currentUser.id ? 'sent' : 'received'}">
                    ${m.text}
                    <span class="msg-time">${timeAgo(new Date(m.timestamp))}</span>
                </div>
            `).join('');

            thread.scrollTop = thread.scrollHeight;
        }

        function sendDirectMessage() {
            if (!currentUser || !currentMessageUserId) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) {
                showToast('Please write a message');
                return;
            }

            const messages = DB.getMessages();
            const key = `${currentUser.id}-${currentMessageUserId}`;
            if (!messages[key]) {
                messages[key] = [];
            }

            messages[key].push({
                senderId: currentUser.id,
                text: text,
                timestamp: new Date().toISOString()
            });

            DB.setMessages(messages);
            input.value = '';
            renderMessages(currentMessageUserId);

            // Add to inbox
            const inbox = DB.getInbox();
            const users = DB.getUsers();
            const user = users.find(u => u.id === currentMessageUserId);
            if (user) {
                // Remove existing entry for this user
                const idx = inbox.findIndex(m => m.userId === currentMessageUserId);
                if (idx > -1) inbox.splice(idx, 1);

                inbox.unshift({
                    userId: user.id,
                    name: user.name,
                    avatar: user.avatar,
                    message: text,
                    timestamp: new Date().toISOString(),
                    fromMe: true
                });
                DB.setInbox(inbox);
            }

            showToast('✅ Message sent!');
        }

        // ===== NOTIFICATIONS =====
        function addNotification(targetUserId, videoId, type) {
            if (!currentUser || targetUserId === currentUser.id) return;

            const notifications = DB.getNotifications();
            const video = videoId ? allVideos.find(v => v.id === videoId) : null;

            notifications.unshift({
                id: DB.getNextId(),
                userId: currentUser.id,
                username: currentUser.username,
                userAvatar: currentUser.avatar,
                targetUserId: targetUserId,
                videoId: videoId,
                type: type,
                message: type === 'liked' ?
                    `❤️ liked your video${video ? ': ' + (video.description || '') : ''}` :
                    type === 'followed' ?
                    '🤝 started following you' :
                    type === 'commented' ?
                    `💬 commented on your video${video ? ': ' + (video.description || '') : ''}` :
                    '',
                read: false,
                timestamp: new Date().toISOString()
            });

            DB.setNotifications(notifications);
        }

        function getNotifications() {
            const notifications = DB.getNotifications();
            if (currentUser) {
                return notifications.filter(n => n.targetUserId === currentUser.id);
            }
            return [];
        }

        function markNotificationsRead() {
            const notifications = DB.getNotifications();
            notifications.forEach(n => {
                if (n.targetUserId === currentUser.id) {
                    n.read = true;
                }
            });
            DB.setNotifications(notifications);
        }

                    </div>
                `;
