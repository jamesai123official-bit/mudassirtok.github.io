            videoComments.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            section.innerHTML = videoComments.map(c => `
                <div class="comment-item">
                    <img class="comment-avatar" src="${c.avatar || 'https://i.pravatar.cc/300?img=' + c.userId}" alt="">
                    <div class="comment-body">
                        <div class="comment-username">@${c.username}</div>
                        <div class="comment-text">${c.text}</div>
                        <div class="comment-time">${timeAgo(new Date(c.timestamp))}</div>
                    </div>
                </div>
            `).join('');
        }

        function postComment() {
            if (!currentUser) {
                showToast('⚠️ Please login to comment');
                return;
            }
            if (!commentVideoId) return;

            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) {
                showToast('Please write something');
                return;
            }

            const comments = DB.getComments();
            if (!comments[commentVideoId]) {
                comments[commentVideoId] = [];
            }

            const video = allVideos.find(v => v.id === commentVideoId);
            comments[commentVideoId].push({
                userId: currentUser.id,
                username: currentUser.username,
                avatar: currentUser.avatar,
                text: text,
                timestamp: new Date().toISOString()
            });

            DB.setComments(comments);
            input.value = '';
            renderComments(commentVideoId);

            if (video && video.userId !== currentUser.id) {
                addNotification(video.userId, commentVideoId, 'commented');
            }

            updateCommentCount(commentVideoId);
            showToast('💬 Comment posted!');
        }

        function updateCommentCount(videoId) {
            const count = getCommentCount(videoId);
            const items = document.querySelectorAll(`.video-item[data-video-id="${videoId}"]`);
            items.forEach(item => {
                const btns = item.querySelectorAll('.action-btn');
                btns.forEach(btn => {
                    const countEl = btn.querySelector('.count');
                    if (countEl && btn.querySelector('.fa-comment')) {
                        countEl.textContent = count;
                    }
                });
            });
        }

        function getCommentCount(videoId) {
            const comments = DB.getComments();
            return (comments[videoId] || []).length;
        }

        // ===== SHARE =====
        function shareVideo(videoId) {
            const video = allVideos.find(v => v.id === videoId);
            if (!video) return;

            const shareText = `🎬 Check out this video from @${video.username} on MudassirTok! ${video.description || ''}`;

            if (navigator.share) {
                navigator.share({
                    title: 'MudassirTok Video',
                    text: shareText,
                    url: window.location.href
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('📋 Copied to clipboard!');
                }).catch(() => {
                    showToast('📋 ' + shareText);
                });
            } else {
                showToast('📋 ' + shareText);
            }
        }

        // ===== UPLOAD =====
        function openUploadModal() {
            if (!currentUser) {
                showToast('⚠️ Please login first');
                return;
            }
            document.getElementById('uploadModal').classList.add('active');
            document.getElementById('uploadForm').reset();
            document.getElementById('musicInput').value = '🎵 Original Audio';
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        function handleUpload(e) {
            e.preventDefault();
            if (!currentUser) {
                showToast('⚠️ Please login to upload');
                return;
            }

            const fileInput = document.getElementById('videoFile');
            const description = document.getElementById('descInput').value.trim() || 'No caption';
            const music = document.getElementById('musicInput').value.trim() || '🎵 Original Audio';

            const file = fileInput.files[0];
            if (!file) {
                showToast('Please select a video file');
                return;
            }

            if (file.size > 500 * 1024 * 1024) {
                showToast('⚠️ Video too large! Max 500MB');
                return;
            }

            if (!file.type.startsWith('video/')) {
                showToast('⚠️ Please select a video file');
                return;
            }

            const videoUrl = URL.createObjectURL(file);

            const newVideo = {
                id: DB.getNextId(),
                userId: currentUser.id,
                username: currentUser.username,
                userAvatar: currentUser.avatar,
                description: description,
                music: music,
                videoUrl: videoUrl,
                likes: 0,
                comments: 0,
                views: 0,
                timestamp: new Date().toISOString(),
                hd: true,
                hasAudio: true
            };

            const videos = DB.getVideos();
            videos.unshift(newVideo);
            DB.setVideos(videos);
            allVideos = videos;

            closeUploadModal();
            loadFeed();
            showToast('✅ Video uploaded successfully with audio! 🎵');

            document.getElementById('feedContainer').scrollTop = 0;
        }

        // ===== LIVE STREAMING =====
        function openLiveModal() {
            if (!currentUser) {
                showToast('⚠️ Please login first');
                return;
            }
            if (isLiveStreaming) {
                showToast('⚠️ You are already live!');
                return;
            }

            const title = prompt('🎬 Enter your live stream title:', 'Live Stream 🎬');
            if (!title) return;

            const category = prompt('📂 Enter category:', 'Chat');
            if (!category) return;

            startLiveStream(title, category);
        }

        function startLiveStream(title, category) {
            if (!currentUser) return;

            const liveStream = {
                id: DB.getNextId(),
                userId: currentUser.id,
                username: currentUser.username,
                userAvatar: currentUser.avatar,
                title: title,
                category: category,
                viewers: 0,
                likes: 0,
                comments: 0,
                active: true,
                timestamp: new Date().toISOString()
            };

            const lives = DB.getLives();
            lives.unshift(liveStream);
            DB.setLives(lives);
            liveStreams = lives;

            isLiveStreaming = true;
            showToast('🔴 You are now LIVE!');

            let viewers = 0;
            liveInterval = setInterval(() => {
                viewers += Math.floor(Math.random() * 3);
                liveStream.viewers = viewers;
                const lives = DB.getLives();
                const idx = lives.findIndex(l => l.id === liveStream.id);
                if (idx > -1) {
                    lives[idx].viewers = viewers;
                    DB.setLives(lives);
                }
                document.querySelectorAll('.live-badge').forEach(badge => {
                    if (badge.textContent.includes('LIVE')) {
                        badge.textContent = `🔴 LIVE · ${viewers} watching`;
                    }
                });
            }, 3000);

            loadFeed();
            switchTab('live');

            // Add stop button
            const stopBtn = document.createElement('button');
            stopBtn.style.cssText = `
                position: fixed;
                bottom: 160px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 200;
                background: #ff0050;
                color: #fff;
                border: none;
                padding: 12px 32px;
                border-radius: 24px;
                font-weight: 700;
                font-size: 16px;
                cursor: pointer;
                box-shadow: 0 4px 30px rgba(255,0,80,0.4);
                animation: livePulse 2s infinite;
                max-width: 430px;
                width: 90%;
                font-family: inherit;
            `;
            stopBtn.id = 'stopLiveBtn';
            stopBtn.innerHTML = '🔴 End Live Stream';
            stopBtn.onclick = stopLiveStream;
            document.querySelector('.app-container').appendChild(stopBtn);

            addNotificationToAll('live_started', liveStream.id);
        }

        function stopLiveStream() {
            if (liveInterval) {
                clearInterval(liveInterval);
                liveInterval = null;
            }
            isLiveStreaming = false;

            const lives = DB.getLives();
            const live = lives.find(l => l.userId === currentUser.id && l.active !== false);
            if (live) {
                live.active = false;
                live.ended = new Date().toISOString();
                DB.setLives(lives);
            }

            const stopBtn = document.getElementById('stopLiveBtn');
            if (stopBtn) stopBtn.remove();

            showToast('📹 Live stream ended');
            loadFeed();
        }

        function addLiveChat(liveId, message) {
            if (!currentUser) return;

            const lives = DB.getLives();
            const live = lives.find(l => l.id === liveId);
            if (live) {
                live.comments = (live.comments || 0) + 1;
                DB.setLives(lives);
            }

            const chatDiv = document.getElementById(`liveChat-${liveId}`);
            if (chatDiv) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-message';
                msgDiv.innerHTML = `
                    <span class="chat-username">@${currentUser.username}</span>
                    ${message}
                `;
                chatDiv.appendChild(msgDiv);
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        }

        function addNotificationToAll(type, liveId) {
            const users = DB.getUsers();
            users.forEach(user => {
                if (user.id !== currentUser.id && isUserFollowing(user.id, currentUser.id)) {
                    const notifications = DB.getNotifications();
                    notifications.unshift({
                        id: DB.getNextId(),
                        userId: currentUser.id,
                        username: currentUser.username,
                        userAvatar: currentUser.avatar,
                        targetUserId: user.id,
                        videoId: liveId,
                        type: 'live',
                        message: `🔴 went LIVE! "${liveStreams.find(l => l.id === liveId)?.title || 'Live Stream'}"`,
                        read: false,
                        timestamp: new Date().toISOString()
                    });
                    DB.setNotifications(notifications);
                }
            });
        }

        // ===== PROFILE =====
        function openProfile() {
            if (!currentUser) {
                showToast('⚠️ Please login first');
                return;
            }
            viewProfile(currentUser.id);
        }

        function viewProfile(userId) {
            const users = DB.getUsers();
            const user = users.find(u => u.id === userId);
            if (!user) {
                showToast('User not found');
                return;
            }

            const videos = DB.getVideos().filter(v => v.userId === userId);
            const followers = getFollowerCount(userId);
            const following = getFollowingCount(userId);
            const isOwnProfile = currentUser && currentUser.id === userId;
            const isFollowing = currentUser && isUserFollowing(currentUser.id, userId);

            const content = document.getElementById('profileContent');
            content.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar-wrapper" onclick="${isOwnProfile ? "document.getElementById('avatarInput').click()" : ''}">
                        <img class="profile-avatar" src="${user.avatar}" alt="${user.username}">
                        ${isOwnProfile ? `
                            <div class="edit-avatar-overlay">
                                <i class="fas fa-camera"></i>
                            </div>
                        ` : ''}
                    </div>
                    <div class="profile-name">${user.name}</div>
                    <div class="profile-username">@${user.username}</div>
                    <div class="profile-bio">${user.bio || '🎬 TikTok content creator'}</div>
                    <div class="profile-stats">
                        <div><div class="num">${videos.length}</div><div class="label">Videos</div></div>
                        <div><div class="num">${followers}</div><div class="label">Followers</div></div>
                        <div><div class="num">${following}</div><div class="label">Following</div></div>
                    </div>
                    <div class="profile-actions">
                        ${!isOwnProfile && currentUser ? `
                            <button class="follow-btn-pro ${isFollowing ? 'following' : ''}" 
                                    onclick="toggleFollow(${userId})">
                                ${isFollowing ? '✓ Following' : '+ Follow'}
                            </button>
                            <button class="message-btn" onclick="closeProfile();openDirectMessage(${userId});">
                                <i class="fas fa-envelope"></i> Message
                            </button>
                        ` : ''}
                        ${isOwnProfile ? `
                            <button class="edit-btn" onclick="editProfile()">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="logout-btn" onclick="logout()">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        ` : ''}
                    </div>
                </div>
                <div class="profile-videos">
                    ${videos.length === 0 ? `
                        <div style="grid-column:1/-1;text-align:center;color:var(--text2);padding:40px;">
                            <i class="fas fa-video" style="font-size:30px;opacity:0.3;"></i>
                            <p style="margin-top:8px;font-size:14px;">No videos yet</p>
                            ${isOwnProfile ? `<button onclick="openUploadModal()" style="margin-top:12px;padding:8px 20px;background:var(--primary);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;">Upload Now</button>` : ''}
                        </div>
                    ` : videos.map(v => `
                        <div class="profile-video-thumb" onclick="scrollToVideo(${v.id})">
                            <video src="${v.videoUrl}" muted playsinline></video>
                            <div class="play-icon"><i class="fas fa-play"></i></div>
                            ${v.views ? `<div class="video-views"><i class="fas fa-eye"></i> ${v.views}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;

            document.getElementById('profileModal').classList.add('active');
        }

        function closeProfile() {
            document.getElementById('profileModal').classList.remove('active');
        }

        function editProfile() {
            if (!currentUser) return;
            const newBio = prompt('Edit your bio:', currentUser.bio || '');
            if (newBio !== null) {
                const users = DB.getUsers();
                const user = users.find(u => u.id === currentUser.id);
                if (user) {
                    user.bio = newBio.trim() || '🎬 TikTok content creator';
                    DB.setUsers(users);
                    currentUser = user;
                    DB.setCurrentUser(user);
                    viewProfile(currentUser.id);
                    showToast('✅ Profile updated!');
                }
            }
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('⚠️ Please select an image');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const users = DB.getUsers();
                const user = users.find(u => u.id === currentUser.id);
                if (user) {
                    user.avatar = e.target.result;
                    DB.setUsers(users);
                    currentUser = user;
                    DB.setCurrentUser(user);

                    const videos = DB.getVideos();
                    videos.forEach(v => {
                        if (v.userId === currentUser.id) {
                            v.userAvatar = e.target.result;
                        }
                    });
                    DB.setVideos(videos);
                    allVideos = videos;

                    viewProfile(currentUser.id);
                    loadFeed();
                    showToast('✅ Profile picture updated!');
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function scrollToVideo(videoId) {
            closeProfile();
            const items = document.querySelectorAll('.video-item');
            for (const item of items) {
                if (parseInt(item.dataset.videoId) === videoId) {
                    item.scrollIntoView({ behavior: 'smooth' });
                    break;
                }
            }
        }

        // ===== SEARCH =====
        function openSearch() {
            document.getElementById('searchModal').classList.add('active');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML =
                '<div style="text-align:center;color:var(--text2);padding:20px;">Search for users by username</div>';
            setTimeout(() => {
                document.getElementById('searchInput').focus();
            }, 300);
        }

        function closeSearch() {
            document.getElementById('searchModal').classList.remove('active');
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const results = document.getElementById('searchResults');

            if (!query) {
                results.innerHTML =
                '<div style="text-align:center;color:var(--text2);padding:20px;">Search for users by username</div>';
                return;
            }

            const users = DB.getUsers();
            const filtered = users.filter(u =>
                u.username.toLowerCase().includes(query) ||
                u.name.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                results.innerHTML = `
                    <div style="text-align:center;color:var(--text2);padding:20px;">
                        <i class="fas fa-user-slash" style="font-size:24px;opacity:0.3;"></i>
                        <p style="margin-top:8px;">No users found</p>
                    </div>
                `;
                return;
            }

            results.innerHTML = filtered.map(u => `
                <div class="search-item" onclick="viewProfile(${u.id});closeSearch();">
                    <img src="${u.avatar}" alt="${u.username}">
                    <div>
                        <div class="search-name">${u.name}</div>
                        <div class="search-username">@${u.username}</div>
                    </div>
                </div>
            `).join('');
        }

        // ===== INBOX =====
        function openInbox() {
            document.getElementById('inboxModal').classList.add('active');
            renderInbox();
        }

        function closeInbox() {
            document.getElementById('inboxModal').classList.remove('active');
        }

        function renderInbox() {
            const inbox = DB.getInbox();
            const content = document.getElementById('inboxContent');

            if (inbox.length === 0) {
                content.innerHTML = `
                    <div style="text-align:center;color:var(--text2);padding:40px;">
                        <i class="fas fa-inbox" style="font-size:40px;opacity:0.3;"></i>
                        <p style="margin-top:10px;font-size:14px;">No messages yet</p>
                    </div>
                `;
                return;
            }

            // Group by user and show latest message
            const grouped = {};
            inbox.forEach(msg => {
                if (!grouped[msg.userId] || new Date(msg.timestamp) > new Date(grouped[msg.userId].timestamp)) {
                    grouped[msg.userId] = msg;
                }
            });

            const sorted = Object.values(grouped).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            content.innerHTML = sorted.map(msg => `
                <div class="inbox-item" onclick="closeInbox();openDirectMessage(${msg.userId});">
                    <img src="${msg.avatar || 'https://i.pravatar.cc/300?img=' + msg.userId}" alt="">
                    <div class="inbox-info">
                        <div class="inbox-name">${msg.name}</div>
                        <div class="inbox-msg">${msg.fromMe ? '👤 You: ' : ''}${msg.message}</div>
                    </div>
                    <div style="font-size:11px;color:var(--text2);">${timeAgo(new Date(msg.timestamp))}</div>
                </div>
            `).join('');
        }

        // ===== NOTIFICATIONS =====
        function openNotifications() {
            document.getElementById('notificationsModal').classList.add('active');
            renderNotifications();
            markNotificationsRead();
        }

        function closeNotifications() {
            document.getElementById('notificationsModal').classList.remove('active');
        }

        function renderNotifications() {
            const notifications = getNotifications();
            const content = document.getElementById('notificationsContent');

            if (notifications.length === 0) {
                content.innerHTML = `
                    <div style="text-align:center;color:var(--text2);padding:40px;">
                        <i class="fas fa-bell" style="font-size:40px;opacity:0.3;"></i>
                        <p style="margin-top:10px;font-size:14px;">No notifications yet</p>
                    </div>
                `;
                return;
            }

            content.innerHTML = notifications.slice(0, 50).map(n => `
                <div class="notification-item">
                    <div class="notif-icon">
                        ${n.type === 'liked' ? '❤️' : n.type === 'followed' ? '🤝' : n.type === 'commented' ? '💬' : '🔴'}
                    </div>
                    <div class="notif-text">
                        <strong>@${n.username}</strong> ${n.message}
                    </div>
                    <div class="notif-time">${timeAgo(new Date(n.timestamp))}</div>
                </div>
            `).join('');
        }

        // ===== TIME AGO =====
        function timeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + 'm ago';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h ago';
            const days = Math.floor(hours / 24);
            if (days < 7) return days + 'd ago';
            return date.toLocaleDateString();
        }

        // ===== TOAST =====
        let toastTimeout = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeUploadModal();
                closeCommentsModal();
                closeProfile();
                closeSearch();
                closeInbox();
                closeNotifications();
                closeMessageModal();
            }
            if (e.key === 'u' && !e.ctrlKey && !e.metaKey) {
                openUploadModal();
            }
            if (e.key === 'l' && !e.ctrlKey && !e.metaKey) {
                openLiveModal();
            }
            if (e.key === 'Enter') {
                if (document.getElementById('commentsModal').classList.contains('active')) {
                    if (document.activeElement === document.getElementById('commentInput')) {
                        postComment();
                    }
                }
                if (document.getElementById('messageModal').classList.contains('active')) {
                    if (document.activeElement === document.getElementById('messageInput')) {
                        sendDirectMessage();
                    }
                }
            }
        });

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();

            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) {
                        modal.classList.remove('active');
                    }
                });
            });

            document.getElementById('authName').value = '';
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';

            console.log('🎬 MudassirTok - Complete with Audio & Messages');
            console.log('👤 Current user:', currentUser);
            console.log('📹 Total videos:', DB.getVideos().length);
            console.log('👥 Total users:', DB.getUsers().length);
            console.log('📨 Total messages:', Object.keys(DB.getMessages()).length);
            console.log('🔊 Audio: ENABLED');
            console.log('💬 Direct Messages: ENABLED');
        });
    </script>

</body>
