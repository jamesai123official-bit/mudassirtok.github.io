<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MudassirTok - Complete TikTok Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        /* ===== APP CONTAINER ===== */
        .app-container {
            max-width: 430px;
            height: 100vh;
            margin: 0 auto;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* ===== AUTH SCREENS ===== */
        .auth-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            max-width: 430px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
            animation: fadeIn 0.5s ease;
        }

        .auth-screen.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .auth-screen .logo {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0050, #00f2ea, #ff0050);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .auth-screen .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
            animation: fadeIn 0.8s ease;
        }

        .auth-screen .auth-box {
            width: 100%;
            max-width: 340px;
        }

        .auth-screen input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .auth-screen input:focus {
            outline: none;
            border-color: #ff0050;
            box-shadow: 0 0 0 4px rgba(255, 0, 80, 0.15);
            background: #222;
        }

        .auth-screen .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .auth-screen .auth-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.3);
        }

        .auth-screen .auth-btn:active {
            transform: scale(0.98);
        }

        .auth-screen .auth-btn.secondary {
            background: transparent;
            border: 2px solid #333;
            margin-top: 8px;
        }

        .auth-screen .auth-btn.secondary:hover {
            border-color: #ff0050;
            background: rgba(255, 0, 80, 0.05);
        }

        .auth-screen .auth-switch {
            color: #888;
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
        }

        .auth-screen .auth-switch span {
            color: #ff0050;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.3s;
        }

        .auth-screen .auth-switch span:hover {
            color: #ff2d55;
            text-decoration: underline;
        }

        /* ===== MAIN APP ===== */
        .main-app {
            display: none;
            height: 100vh;
            position: relative;
        }

        .main-app.active {
            display: block;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 430px;
            margin: 0 auto;
            pointer-events: none;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0050, #00f2ea, #ff0050);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            letter-spacing: -0.5px;
        }

        .header .header-icons {
            display: flex;
            gap: 18px;
            pointer-events: auto;
            font-size: 20px;
        }

        .header .header-icons i {
            cursor: pointer;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            transition: all 0.2s;
        }

        .header .header-icons i:active {
            transform: scale(0.85);
        }

        /* ===== FEED TABS ===== */
        .feed-tabs {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            z-index: 99;
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 430px;
            margin: 0 auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feed-tabs .tab {
            background: none;
            border: none;
            color: #888;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
            transition: all 0.3s;
            position: relative;
            font-family: inherit;
        }

        .feed-tabs .tab.active {
            color: #fff;
        }

        .feed-tabs .tab.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: linear-gradient(90deg, #ff0050, #00f2ea);
            border-radius: 4px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 24px;
                opacity: 1;
            }
        }

        .feed-tabs .tab:hover {
            color: #fff;
        }

        /* ===== FEED CONTAINER ===== */
        .feed-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            padding-top: 105px;
        }

        .feed-container::-webkit-scrollbar {
            display: none;
        }

        /* ===== VIDEO ITEM ===== */
        .video-item {
            height: calc(100vh - 105px);
            min-height: 600px;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
        }

        /* Video Gradient Overlay */
        .video-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.6) 0%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Video Info */
        .video-info {
            position: absolute;
            bottom: 100px;
            left: 16px;
            right: 80px;
            z-index: 10;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .video-info .username {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .video-info .username:hover {
            opacity: 0.8;
        }

        .video-info .username .badge {
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        .video-info .description {
            font-size: 15px;
            opacity: 0.95;
            line-height: 1.5;
            margin-top: 2px;
        }

        .video-info .music {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .video-info .music:hover {
            opacity: 1;
        }

        .video-info .music i {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            position: absolute;
            right: 12px;
            bottom: 100px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .actions .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.2s;
            background: none;
            border: none;
            color: #fff;
            padding: 0;
            position: relative;
        }

        .actions .action-btn:active {
            transform: scale(0.85);
        }

        .actions .action-btn .icon {
            font-size: 28px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            transition: all 0.3s;
        }

        .actions .action-btn .count {
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .actions .action-btn .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2.5px solid #fff;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            cursor: pointer;
        }

        .actions .action-btn .avatar:hover {
            transform: scale(1.05);
            border-color: #ff0050;
        }

        .actions .action-btn.liked .icon {
            color: #ff0050;
            animation: likeAnimation 0.4s ease;
        }

        @keyframes likeAnimation {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
            100% {
                transform: scale(1);
            }
        }

        .actions .action-btn .follow-btn {
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            border: none;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 2px;
            box-shadow: 0 4px 15px rgba(255, 0, 80, 0.3);
        }

        .actions .action-btn .follow-btn:active {
            transform: scale(0.9);
        }

        .actions .action-btn .follow-btn.following {
            background: #333;
            box-shadow: none;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 6px 0 env(safe-area-inset-bottom);
            max-width: 430px;
            margin: 0 auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: none;
            border: none;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            padding: 4px 12px;
            transition: all 0.3s;
            font-weight: 500;
            font-family: inherit;
        }

        .bottom-nav .nav-item i {
            font-size: 24px;
            transition: all 0.3s;
        }

        .bottom-nav .nav-item.active {
            color: #fff;
        }

        .bottom-nav .nav-item.active i {
            color: #fff;
            transform: scale(1.05);
        }

        .bottom-nav .nav-item .upload-icon {
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -24px;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 4px 30px rgba(255, 0, 80, 0.4);
            transition: all 0.3s;
        }

        .bottom-nav .nav-item .upload-icon:active {
            transform: scale(0.9);
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 430px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 400px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-content .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-content .close-modal {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            transition: transform 0.3s;
        }

        .modal-content .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .modal-content input:focus,
        .modal-content textarea:focus {
            outline: none;
            border-color: #ff0050;
            box-shadow: 0 0 0 4px rgba(255, 0, 80, 0.1);
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-content input[type="file"] {
            background: transparent;
            border: 2px dashed #444;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-content input[type="file"]:hover {
            border-color: #ff0050;
            background: rgba(255, 0, 80, 0.05);
        }

        .modal-content .upload-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-content .upload-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.3);
        }

        .modal-content .upload-btn:active {
            transform: scale(0.98);
        }

        /* ===== COMMENTS ===== */
        .comments-section {
            max-height: 300px;
            overflow-y: auto;
            margin: 12px 0;
            padding-right: 8px;
        }

        .comments-section::-webkit-scrollbar {
            width: 4px;
        }

        .comments-section::-webkit-scrollbar-thumb {
            background: #ff0050;
            border-radius: 4px;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #222;
            animation: fadeIn 0.3s ease;
        }

        .comment-item .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            flex-shrink: 0;
            object-fit: cover;
        }

        .comment-item .comment-body {
            flex: 1;
        }

        .comment-item .comment-body .comment-username {
            font-weight: 600;
            font-size: 13px;
            color: #ff0050;
        }

        .comment-item .comment-body .comment-text {
            font-size: 14px;
            opacity: 0.95;
            margin-top: 2px;
        }

        .comment-item .comment-body .comment-time {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .comment-input-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #222;
        }

        .comment-input-row input {
            flex: 1;
            padding: 10px 16px;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 24px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .comment-input-row input:focus {
            outline: none;
            border-color: #ff0050;
        }

        .comment-input-row button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            border: none;
            border-radius: 24px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .comment-input-row button:hover {
            transform: scale(1.05);
        }

        .comment-input-row button:active {
            transform: scale(0.95);
        }

        /* ===== PROFILE ===== */
        .profile-header {
            text-align: center;
            padding: 10px 0 20px;
        }

        .profile-header .profile-avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 12px;
            cursor: pointer;
        }

        .profile-header .profile-avatar-wrapper .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff0050;
            object-fit: cover;
            transition: all 0.3s;
        }

        .profile-header .profile-avatar-wrapper .profile-avatar:hover {
            transform: scale(1.05);
            border-color: #00f2ea;
        }

        .profile-header .profile-avatar-wrapper .edit-avatar-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #ff0050;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #1a1a1a;
            cursor: pointer;
            transition: all 0.3s;
        }

        .profile-header .profile-avatar-wrapper .edit-avatar-overlay:hover {
            transform: scale(1.1);
            background: #00f2ea;
        }

        .profile-header .profile-avatar-wrapper .edit-avatar-overlay i {
            font-size: 14px;
        }

        .profile-header .profile-name {
            font-size: 22px;
            font-weight: 700;
        }

        .profile-header .profile-username {
            color: #888;
            font-size: 14px;
            margin-top: 2px;
        }

        .profile-header .profile-bio {
            color: #aaa;
            font-size: 14px;
            margin-top: 6px;
            padding: 0 20px;
        }

        .profile-header .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 16px 0;
        }

        .profile-header .profile-stats div {
            text-align: center;
        }

        .profile-header .profile-stats .num {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .profile-header .profile-stats .label {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .profile-header .profile-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .profile-header .profile-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .profile-header .profile-actions button:hover {
            transform: scale(1.05);
        }

        .profile-header .profile-actions button:active {
            transform: scale(0.95);
        }

        .profile-header .profile-actions .follow-btn-pro {
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 80, 0.3);
        }

        .profile-header .profile-actions .follow-btn-pro.following {
            background: #333;
            box-shadow: none;
        }

        .profile-header .profile-actions .edit-btn {
            background: #333;
            color: #fff;
        }

        .profile-header .profile-actions .logout-btn {
            background: transparent;
            border: 2px solid #333;
            color: #ff0050;
        }

        .profile-header .profile-actions .logout-btn:hover {
            border-color: #ff0050;
            background: rgba(255, 0, 80, 0.05);
        }

        .profile-videos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 0 4px;
        }

        .profile-videos .profile-video-thumb {
            aspect-ratio: 1;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .profile-videos .profile-video-thumb:hover {
            transform: scale(1.02);
            z-index: 1;
        }

        .profile-videos .profile-video-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-videos .profile-video-thumb .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            opacity: 0.7;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        .profile-videos .profile-video-thumb .video-views {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 8px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }

        /* ===== SEARCH ===== */
        .search-container {
            padding: 16px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .search-container input:focus {
            outline: none;
            border-color: #ff0050;
            box-shadow: 0 0 0 4px rgba(255, 0, 80, 0.1);
        }

        .search-results {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .search-results .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #1a1a1a;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-results .search-item:hover {
            background: #2a2a2a;
            transform: translateX(4px);
        }

        .search-results .search-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .search-results .search-item .search-name {
            font-weight: 600;
        }

        .search-results .search-item .search-username {
            color: #888;
            font-size: 13px;
        }

        /* ===== NOTIFICATIONS ===== */
        .notification-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .notification-item:hover {
            background: #2a2a2a;
        }

        .notification-item .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .notification-item .notif-text {
            flex: 1;
            font-size: 14px;
        }

        .notification-item .notif-time {
            font-size: 11px;
            color: #666;
        }

        /* ===== INBOX ===== */
        .inbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .inbox-item:hover {
            background: #2a2a2a;
            transform: translateX(4px);
        }

        .inbox-item img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .inbox-item .inbox-info {
            flex: 1;
        }

        .inbox-item .inbox-info .inbox-name {
            font-weight: 600;
        }

        .inbox-item .inbox-info .inbox-msg {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 60vh;
            color: #666;
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state h3 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .empty-state p {
            color: #888;
            font-size: 14px;
            max-width: 280px;
            line-height: 1.5;
        }

        .empty-state .empty-btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #ff0050, #ff2d55);
            border: none;
            border-radius: 24px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .empty-state .empty-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 430px) {
            .app-container,
            .auth-screen,
            .modal-overlay {
                max-width: 100%;
            }
            .header {
                max-width: 100%;
                padding: 10px 12px;
            }
            .feed-tabs {
                max-width: 100%;
                top: 56px;
                gap: 24px;
            }
            .bottom-nav {
                max-width: 100%;
            }
            .video-info {
                bottom: 90px;
                left: 12px;
                right: 70px;
            }
            .video-info .username {
                font-size: 16px;
            }
            .video-info .description {
                font-size: 14px;
            }
            .actions {
                right: 8px;
                bottom: 90px;
                gap: 14px;
            }
            .actions .action-btn .icon {
                font-size: 24px;
            }
            .actions .action-btn .avatar {
                width: 44px;
                height: 44px;
            }
            .bottom-nav .nav-item .upload-icon {
                width: 48px;
                height: 48px;
                font-size: 22px;
                margin-top: -22px;
            }
            .profile-header .profile-avatar-wrapper {
                width: 80px;
                height: 80px;
            }
            .profile-header .profile-avatar-wrapper .profile-avatar {
                width: 80px;
                height: 80px;
            }
            .profile-header .profile-stats {
                gap: 24px;
            }
            .toast {
                bottom: 80px;
                max-width: 320px;
                font-size: 13px;
                padding: 12px 20px;
            }
        }

        @media (max-width: 360px) {
            .feed-tabs .tab {
                font-size: 14px;
            }
            .header h1 {
                font-size: 20px;
            }
            .bottom-nav .nav-item {
                font-size: 9px;
                padding: 2px 8px;
            }
            .bottom-nav .nav-item i {
                font-size: 20px;
            }
        }

        /* ===== HD QUALITY INDICATOR ===== */
        .hd-badge {
            position: absolute;
            top: 80px;
            right: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            color: #00f2ea;
            border: 1px solid rgba(0, 242, 234, 0.2);
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* ===== LOADING SHIMMER ===== */
        .shimmer {
            background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ===== PROGRESS BAR ===== */
        .video-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 5;
        }

        .video-progress .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff0050, #00f2ea);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* ===== DOUBLE TAP LIKE ===== */
        .heart-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: #ff0050;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: heartBurst 0.8s ease forwards;
        }

        @keyframes heartBurst {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2);
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== AUTH SCREEN ===== -->
    <div class="auth-screen" id="authScreen">
        <div class="logo">♬ MudassirTok</div>
        <div class="subtitle">Share your world, one video at a time ✨</div>

        <div class="auth-box">
            <div id="authForm">
                <input type="text" id="authName" placeholder="Full Name" required>
                <input type="text" id="authUsername" placeholder="Username" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                <button class="auth-btn" id="authSubmitBtn">Create Account</button>
                <button class="auth-btn secondary" id="authSwitchBtn">Already have an account? Log in</button>
            </div>
            <div class="auth-switch" id="authSwitchText">
                <span id="authSwitchLink">Already have an account? Log in</span>
            </div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div class="main-app" id="mainApp">

        <!-- Header -->
        <div class="header">
            <h1>♬ MudassirTok</h1>
            <div class="header-icons">
                <i class="fas fa-search" onclick="openSearch()"></i>
                <i class="fas fa-plus-circle" onclick="openUploadModal()"></i>
                <i class="fas fa-user" onclick="openProfile()"></i>
                <i class="fas fa-sign-out-alt" onclick="logout()" style="font-size:18px;"></i>
            </div>
        </div>

        <!-- Feed Tabs -->
        <div class="feed-tabs">
            <button class="tab active" data-tab="for-you" onclick="switchTab('for-you')">For You</button>
            <button class="tab" data-tab="following" onclick="switchTab('following')">Following</button>
        </div>

        <!-- Feed -->
        <div class="feed-container" id="feedContainer">
            <!-- Videos injected here -->
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('for-you')"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" onclick="openSearch()"><i class="fas fa-search"></i><span>Search</span></button>
            <button class="nav-item" onclick="openUploadModal()">
                <div class="upload-icon"><i class="fas fa-plus"></i></div>
                <span>Upload</span>
            </button>
            <button class="nav-item" onclick="openInbox()"><i class="fas fa-envelope"></i><span>Inbox</span></button>
            <button class="nav-item" onclick="openNotifications()"><i class="fas fa-bell"></i><span>Activity</span></button>
        </div>
    </div>

    <!-- ===== UPLOAD MODAL ===== -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📹 Upload Video</h2>
                <button class="close-modal" onclick="closeUploadModal()">&times;</button>
            </div>
            <form id="uploadForm" onsubmit="handleUpload(event)">
                <input type="file" id="videoFile" accept="video/*" required>
                <input type="text" id="descInput" placeholder="Write a caption..." maxlength="150">
                <input type="text" id="musicInput" placeholder="Add music name (optional)">
                <button type="submit" class="upload-btn"><i class="fas fa-cloud-upload-alt"></i> Upload HD Video</button>
            </form>
        </div>
    </div>

    <!-- ===== COMMENTS MODAL ===== -->
    <div class="modal-overlay" id="commentsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💬 Comments</h2>
                <button class="close-modal" onclick="closeCommentsModal()">&times;</button>
            </div>
            <div class="comments-section" id="commentsSection">
                <!-- Comments injected here -->
            </div>
            <div class="comment-input-row">
                <input type="text" id="commentInput" placeholder="Add a comment..." maxlength="200">
                <button onclick="postComment()">Post</button>
            </div>
        </div>
    </div>

    <!-- ===== PROFILE MODAL ===== -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2>👤 Profile</h2>
                <button class="close-modal" onclick="closeProfile()">&times;</button>
            </div>
            <div id="profileContent">
                <!-- Profile injected here -->
            </div>
        </div>
    </div>

    <!-- ===== SEARCH MODAL ===== -->
    <div class="modal-overlay" id="searchModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2>🔍 Search</h2>
                <button class="close-modal" onclick="closeSearch()">&times;</button>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search users..." oninput="performSearch()">
                <div class="search-results" id="searchResults">
                    <div style="text-align:center;color:#666;padding:20px;">Search for users by username</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== INBOX MODAL ===== -->
    <div class="modal-overlay" id="inboxModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2>📥 Inbox</h2>
                <button class="close-modal" onclick="closeInbox()">&times;</button>
            </div>
            <div id="inboxContent">
                <!-- Inbox messages injected here -->
            </div>
        </div>
    </div>

    <!-- ===== NOTIFICATIONS MODAL ===== -->
    <div class="modal-overlay" id="notificationsModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h2>🔔 Activity</h2>
                <button class="close-modal" onclick="closeNotifications()">&times;</button>
            </div>
            <div id="notificationsContent">
                <!-- Notifications injected here -->
            </div>
        </div>
    </div>

    <!-- ===== AVATAR UPLOAD (hidden) ===== -->
    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">

    <script>
        // ============================================================
        //  MUDASSIRTOK - COMPLETE BACKEND (localStorage)
        // ============================================================

        // ===== DATA LAYER =====
        const DB = {
            getUsers() {
                return JSON.parse(localStorage.getItem('mudassirtok_users') || '[]');
            },
            setUsers(users) {
                localStorage.setItem('mudassirtok_users', JSON.stringify(users));
            },
            getVideos() {
                return JSON.parse(localStorage.getItem('mudassirtok_videos') || '[]');
            },
            setVideos(videos) {
                localStorage.setItem('mudassirtok_videos', JSON.stringify(videos));
            },
            getComments() {
                return JSON.parse(localStorage.getItem('mudassirtok_comments') || '{}');
            },
            setComments(comments) {
                localStorage.setItem('mudassirtok_comments', JSON.stringify(comments));
            },
            getLikes() {
                return JSON.parse(localStorage.getItem('mudassirtok_likes') || '{}');
            },
            setLikes(likes) {
                localStorage.setItem('mudassirtok_likes', JSON.stringify(likes));
            },
            getFollows() {
                return JSON.parse(localStorage.getItem('mudassirtok_follows') || '{}');
            },
            setFollows(follows) {
                localStorage.setItem('mudassirtok_follows', JSON.stringify(follows));
            },
            getNotifications() {
                return JSON.parse(localStorage.getItem('mudassirtok_notifications') || '[]');
            },
            setNotifications(notifications) {
                localStorage.setItem('mudassirtok_notifications', JSON.stringify(notifications));
            },
            getInbox() {
                return JSON.parse(localStorage.getItem('mudassirtok_inbox') || '[]');
            },
            setInbox(inbox) {
                localStorage.setItem('mudassirtok_inbox', JSON.stringify(inbox));
            },
            getCurrentUser() {
                return JSON.parse(localStorage.getItem('mudassirtok_current_user') || 'null');
            },
            setCurrentUser(user) {
                localStorage.setItem('mudassirtok_current_user', JSON.stringify(user));
            },
            getNextId() {
                const id = parseInt(localStorage.getItem('mudassirtok_id') || '0');
                localStorage.setItem('mudassirtok_id', String(id + 1));
                return id + 1;
            }
        };

        // ===== STATE =====
        let currentUser = null;
        let currentTab = 'for-you';
        let commentVideoId = null;
        let allVideos = [];
        let observer = null;
        let viewCounts = {};

        // ===== AUTH =====
        function initAuth() {
            const user = DB.getCurrentUser();
            if (user) {
                currentUser = user;
                showMainApp();
            } else {
                showAuthScreen();
            }
            setupAuthListeners();
        }

        function showAuthScreen() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.remove('active');
        }

        function showMainApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('active');
            loadFeed();
            updateNav();
        }

        function updateNav() {
            document.querySelectorAll('.bottom-nav .nav-item').forEach((item, index) => {
                item.classList.toggle('active', index === 0);
            });
        }

        function setupAuthListeners() {
            let isLogin = false;

            document.getElementById('authSubmitBtn').addEventListener('click', (e) => {
                e.preventDefault();
                const name = document.getElementById('authName').value.trim();
                const username = document.getElementById('authUsername').value.trim().toLowerCase();
                const password = document.getElementById('authPassword').value.trim();

                if (!name || !username || !password) {
                    showToast('⚠️ Please fill in all fields');
                    return;
                }

                if (username.length < 3) {
                    showToast('⚠️ Username must be at least 3 characters');
                    return;
                }

                if (password.length < 4) {
                    showToast('⚠️ Password must be at least 4 characters');
                    return;
                }

                if (isLogin) {
                    // LOGIN
                    const users = DB.getUsers();
                    const user = users.find(u => u.username === username && u.password === password);
                    if (!user) {
                        showToast('❌ Invalid username or password');
                        return;
                    }
                    currentUser = user;
                    DB.setCurrentUser(user);
                    showToast('✅ Welcome back, ' + user.name + '!');
                    showMainApp();
                } else {
                    // SIGNUP
                    const users = DB.getUsers();
                    if (users.find(u => u.username === username)) {
                        showToast('❌ Username already taken');
                        return;
                    }
                    const newUser = {
                        id: DB.getNextId(),
                        name: name,
                        username: username,
                        password: password,
                        avatar: 'https://i.pravatar.cc/300?img=' + DB.getNextId(),
                        bio: 'Welcome to MudassirTok! 🎬',
                        joined: new Date().toISOString()
                    };
                    users.push(newUser);
                    DB.setUsers(users);
                    currentUser = newUser;
                    DB.setCurrentUser(newUser);

                    // Add welcome video
                    addWelcomeVideo(newUser.username);

                    showToast('🎉 Account created! Welcome to MudassirTok!');
                    showMainApp();
                }
            });

            document.getElementById('authSwitchBtn').addEventListener('click', () => {
                isLogin = !isLogin;
                const btn = document.getElementById('authSubmitBtn');
                const switchBtn = document.getElementById('authSwitchBtn');
                const nameInput = document.getElementById('authName');
                const switchText = document.getElementById('authSwitchText');

                if (isLogin) {
                    btn.textContent = 'Log In';
                    switchBtn.textContent = 'Create new account';
                    switchText.innerHTML = "Don't have an account? <span id='authSwitchLink'>Sign up</span>";
                    nameInput.style.display = 'none';
                } else {
                    btn.textContent = 'Create Account';
                    switchBtn.textContent = 'Already have an account? Log in';
                    switchText.innerHTML = "Already have an account? <span id='authSwitchLink'>Log in</span>";
                    nameInput.style.display = 'block';
                }

                document.getElementById('authSwitchLink').addEventListener('click', () => {
                    document.getElementById('authSwitchBtn').click();
                });
            });

            document.getElementById('authSwitchLink').addEventListener('click', () => {
                document.getElementById('authSwitchBtn').click();
            });

            // Enter key support
            document.querySelectorAll('#authForm input').forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        document.getElementById('authSubmitBtn').click();
                    }
                });
            });
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                DB.setCurrentUser(null);
                currentUser = null;
                showAuthScreen();
                showToast('👋 Logged out successfully');
            }
        }

        // ===== WELCOME VIDEO =====
        function addWelcomeVideo(username) {
            const videos = DB.getVideos();
            const welcomeVid = {
                id: DB.getNextId(),
                userId: currentUser.id,
                username: username,
                userAvatar: currentUser.avatar,
                description: '🎬 Welcome to MudassirTok! This is your first video. Upload your own videos by clicking the + button!',
                music: '🎵 MudassirTok Theme',
                videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
                likes: 0,
                comments: 0,
                views: 0,
                timestamp: new Date().toISOString(),
                isWelcome: true,
                hd: true
            };
            videos.unshift(welcomeVid);
            DB.setVideos(videos);
        }

        // ===== FEED =====
        function loadFeed() {
            allVideos = DB.getVideos();
            renderFeed();
        }

        function renderFeed() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';

            let feedVideos = [...allVideos];

            // Filter by tab
            if (currentTab === 'following' && currentUser) {
                const follows = DB.getFollows();
                const following = follows[currentUser.id] || [];

                         alt="avatar" onclick="viewProfile(${video.userId})">

                actions.appendChild(avatarBtn);

                // Follow button (only if not own video)
                if (currentUser && video.userId !== currentUser.id) {
                    const followBtn = document.createElement('button');

                // Like

        // ===== VIDEO PLAYBACK =====
        function setupVideoPlayback() {
            if (observer) observer.disconnect();

            const container = document.getElementById('feedContainer');
            const videoItems = container.querySelectorAll('.video-item');

            const options = {
                root: container,
                rootMargin: '0px',
                threshold: 0.6
            };

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const progress = entry.target.querySelector('.progress-bar');
                    if (!video) return;

                    if (entry.isIntersecting) {
                        video.play().catch(e => console.log('Autoplay blocked:', e));
                        // Track view
                        const videoId = parseInt(entry.target.dataset.videoId);
                        if (videoId && !viewCounts[videoId]) {
                            viewCounts[videoId] = true;
                            trackView(videoId);
                        }
                    } else {
                        video.pause();
                    }
                });
            }, options);

            videoItems.forEach(item => observer.observe(item));

            // Video progress tracking
            videoItems.forEach(item => {
                const video = item.querySelector('video');
                const progress = item.querySelector('.progress-bar');
                if (video && progress) {
                    video.addEventListener('timeupdate', () => {
                        if (video.duration) {
                            const pct = (video.currentTime / video.duration) * 100;
                            progress.style.width = pct + '%';
                        }
                    });
                }
            });

            // Scroll handler for better UX
            container.addEventListener('scroll', () => {
                const items = container.querySelectorAll('.video-item');
                let bestItem = null;
                let bestRatio = 0;

                items.forEach(item => {
                    const rect = item.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    const visibleHeight = Math.min(rect.bottom, containerRect.bottom) - Math.max(rect.top,
                    containerRect.top);
                    const ratio = visibleHeight / rect.height;
                    if (ratio > bestRatio) {
                        bestRatio = ratio;
                        bestItem = item;
                    }
                });

                if (bestItem && bestRatio > 0.3) {
                    const video = bestItem.querySelector('video');
                    if (video && video.paused) {
                        video.play().catch(e => {});
                    }
                }
            }, { passive: true });
        }

        function trackView(videoId) {
            const videos = DB.getVideos();
            const video = videos.find(v => v.id === videoId);
            if (video) {
                video.views = (video.views || 0) + 1;
                DB.setVideos(videos);
                allVideos = videos;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.feed-tabs .tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            document.querySelectorAll('.bottom-nav .nav-item').forEach((item, index) => {

        // ===== LIKE =====
        function toggleLike(videoId) {
            if (!currentUser) {
                showToast('⚠️ Please login to like');
                return;
            }

            const likes = DB.getLikes();
            if (!likes[currentUser.id]) {
                likes[currentUser.id] = [];
            }

            const index = likes[currentUser.id].indexOf(videoId);
            let liked = false;
            if (index > -1) {
                likes[currentUser.id].splice(index, 1);
            } else {
                likes[currentUser.id].push(videoId);
                liked = true;
                // Add notification for like
                addNotification(currentUser.id, videoId, 'liked');
            }

            DB.setLikes(likes);

            // Update UI
            const count = getLikeCount(videoId);
            const countEl = document.getElementById(`likeCount-${videoId}`);
            if (countEl) countEl.textContent = count;

            const btn = document.querySelector(`.action-btn[data-video-id="${videoId}"]`);
            if (btn) {
                btn.classList.toggle('liked');
            }
        }

        function getLikeCount(videoId) {
            const likes = DB.getLikes();
            let count = 0;
            for (const userId in likes) {
                if (likes[userId].includes(videoId)) count++;
            }
            return count;
        }

        // ===== FOLLOW =====
        function toggleFollow(userId) {
            if (!currentUser) {
                showToast('⚠️ Please login to follow');
                return;
            }
            if (userId === currentUser.id) {
                showToast('You can\'t follow yourself 😄');
                return;
            }

            const follows = DB.getFollows();
            if (!follows[currentUser.id]) {
                follows[currentUser.id] = [];
            }

            const index = follows[currentUser.id].indexOf(userId);
            let following = false;
            if (index > -1) {
                follows[currentUser.id].splice(index, 1);
                showToast('Unfollowed user');
            } else {
                follows[currentUser.id].push(userId);
                following = true;
                showToast('✅ Following!');
                addNotification(userId, null, 'followed');
            }

            DB.setFollows(follows);
            renderFeed();

            // Update profile if open
            if (document.getElementById('profileModal').classList.contains('active')) {
                viewProfile(userId);
            }
        }

        function isUserFollowing(followerId, followeeId) {
            if (!followerId) return false;
            const follows = DB.getFollows();
            return follows[followerId] && follows[followerId].includes(followeeId);
        }

        function getFollowerCount(userId) {
            const follows = DB.getFollows();
            let count = 0;
            for (const key in follows) {
                if (follows[key].includes(userId)) count++;
            }
            return count;
        }

        function getFollowingCount(userId) {
            const follows = DB.getFollows();
            return (follows[userId] || []).length;
        }

        // ===== NOTIFICATIONS =====
        function addNotification(targetUserId, videoId, type) {
            if (!currentUser || targetUserId === currentUser.id) return;

            const notifications = DB.getNotifications();
            const video = videoId ? allVideos.find(v => v.id === videoId) : null;

            notifications.unshift({
                id: DB.getNextId(),
                userId: currentUser.id,
                username: currentUser.username,
                userAvatar: currentUser.avatar,
                targetUserId: targetUserId,
                videoId: videoId,
                type: type,
                message: type === 'liked' ?
                    `❤️ liked your video${video ? ': ' + (video.description || '') : ''}` :
                    type === 'followed' ?
                    '🤝 started following you' :
                    type === 'commented' ?
                    `💬 commented on your video${video ? ': ' + (video.description || '') : ''}` :
                    '',
                read: false,
                timestamp: new Date().toISOString()
            });

            DB.setNotifications(notifications);
        }

        function getNotifications() {
            const notifications = DB.getNotifications();
            if (currentUser) {
                return notifications.filter(n => n.targetUserId === currentUser.id);
            }
            return [];

            const notifications = DB.getNotifications();

            const input = document.getElementById('commentInput');

                showToast('Please write something');
                return;

            const comments = DB.getComments();
            if (!comments[commentVideoId]) {
                comments[commentVideoId] = [];

            const video = allVideos.find(v => v.id === commentVideoId);
            comments[commentVideoId].push({
                userId: currentUser.id,
                username: currentUser.username,

            });

            items.forEach(item => {
                const btns = item.querySelectorAll('.action-btn');
                btns.forEach(btn => {

                    if (countEl && btn.querySelector('.fa-comment')) {
                        countEl.textContent = count;

        function getCommentCount(videoId) {

        // ===== SHARE =====
        function shareVideo(videoId) {
            const video = allVideos.find(v => v.id === videoId);
            if (!video) return;

            const shareText = `🎬 Check out this video from @${video.username} on MudassirTok! ${video.description || ''}`;

            if (navigator.share) {
                navigator.share({
                    title: 'MudassirTok Video',
                    text: shareText,
                    url: window.location.href
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('📋 Copied to clipboard!');
                }).catch(() => {
                    showToast('📋 ' + shareText);
                });
            } else {
                showToast('📋 ' + shareText);
            }
        }

            document.getElementById('uploadForm').reset();

        function handleUpload(e) {
            e.preventDefault();
            if (!currentUser) {
                showToast('⚠️ Please login to upload');
                return;
            }

            const fileInput = document.getElementById('videoFile');
            const description = document.getElementById('descInput').value.trim() || 'No caption';
            const music = document.getElementById('musicInput').value.trim() || '🎵 Original audio';

            const file = fileInput.files[0];
            if (!file) {
                showToast('Please select a video file');
                return;
            }

            // Check file size (max 500MB for HD)
            if (file.size > 500 * 1024 * 1024) {
                showToast('⚠️ Video too large! Max 500MB');
                return;
            }

            // Check if it's a video
            if (!file.type.startsWith('video/')) {
                showToast('⚠️ Please select a video file');
                return;
            }

            const videoUrl = URL.createObjectURL(file);

            const newVideo = {
                id: DB.getNextId(),
                userId: currentUser.id,
                username: currentUser.username,
                userAvatar: currentUser.avatar,
                description: description,
                music: music,
                videoUrl: videoUrl,
                likes: 0,
                comments: 0,
                views: 0,
                timestamp: new Date().toISOString(),
                hd: true // HD quality
            };

            const videos = DB.getVideos();
            videos.unshift(newVideo);
            DB.setVideos(videos);
            allVideos = videos;

            closeUploadModal();
            loadFeed();
            showToast('✅ HD Video uploaded successfully!');

            // Scroll to top
            document.getElementById('feedContainer').scrollTop = 0;
        }

            const newBio = prompt('Edit your bio:', currentUser.bio || '');
            if (newBio !== null) {
                const users = DB.getUsers();
                const user = users.find(u => u.id === currentUser.id);
                if (user) {
                    user.bio = newBio.trim() || '🎬 TikTok content creator';
                    DB.setUsers(users);
                    currentUser = user;
                    DB.setCurrentUser(user);
                    viewProfile(currentUser.id);
                    showToast('✅ Profile updated!');
                }
            }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('⚠️ Please select an image');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const users = DB.getUsers();
                const user = users.find(u => u.id === currentUser.id);
                if (user) {
                    user.avatar = e.target.result;
                    DB.setUsers(users);
                    currentUser = user;
                    DB.setCurrentUser(user);

                    // Update all videos with new avatar
                    const videos = DB.getVideos();
                    videos.forEach(v => {
                        if (v.userId === currentUser.id) {
                            v.userAvatar = e.target.result;
                        }
                    });
                    DB.setVideos(videos);
                    allVideos = videos;

                    viewProfile(currentUser.id);
                    loadFeed();
                    showToast('✅ Profile picture updated!');
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

            closeProfile();

            for (const item of items) {
                if (parseInt(item.dataset.videoId) === videoId) {
                    item.scrollIntoView({ behavior: 'smooth' });

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const results = document.getElementById('searchResults');

            if (!query) {
                results.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">Search for users by username</div>';
                return;
            }

            const users = DB.getUsers();
            const filtered = users.filter(u =>
                u.username.toLowerCase().includes(query) ||
                u.name.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                results.innerHTML = `
                    <div style="text-align:center;color:#666;padding:20px;">
                        <i class="fas fa-user-slash" style="font-size:24px;opacity:0.3;"></i>
                        <p style="margin-top:8px;">No users found</p>
                    </div>
                `;
                return;
            }

            results.innerHTML = filtered.map(u => `
                <div class="search-item" onclick="viewProfile(${u.id});closeSearch();">
                    <img src="${u.avatar}" alt="${u.username}">
                    <div>
                        <div class="search-name">${u.name}</div>
                        <div class="search-username">@${u.username}</div>
                    </div>
                </div>
            `).join('');
        }

        // ===== INBOX =====
        function openInbox() {
            document.getElementById('inboxModal').classList.add('active');
            renderInbox();
        }

        function closeInbox() {
            document.getElementById('inboxModal').classList.remove('active');
        }

        function renderInbox() {
            const inbox = DB.getInbox();
            const content = document.getElementById('inboxContent');

            if (inbox.length === 0) {
                content.innerHTML = `
                    <div style="text-align:center;color:#666;padding:40px;">
                        <i class="fas fa-inbox" style="font-size:40px;opacity:0.3;"></i>
                        <p style="margin-top:10px;font-size:14px;">No messages yet</p>
                    </div>
                `;
                return;
            }

            content.innerHTML = inbox.map(msg => `
                <div class="inbox-item">
                    <img src="${msg.avatar || 'https://i.pravatar.cc/300?img=' + msg.userId}" alt="">
                    <div class="inbox-info">
                        <div class="inbox-name">${msg.name}</div>
                        <div class="inbox-msg">${msg.message}</div>
                    </div>
                    <div style="font-size:11px;color:#666;">${timeAgo(new Date(msg.timestamp))}</div>
                </div>
            `).join('');
        }

        function sendMessage(userId, message) {
            const users = DB.getUsers();
            const user = users.find(u => u.id === userId);
            if (!user) return;

            const inbox = DB.getInbox();
            inbox.push({
                userId: userId,
                name: user.name,
                avatar: user.avatar,
                message: message,
                timestamp: new Date().toISOString()
            });
            DB.setInbox(inbox);
        }

        // ===== NOTIFICATIONS =====
        function openNotifications() {
            document.getElementById('notificationsModal').classList.add('active');
            renderNotifications();
            markNotificationsRead();
        }

        function closeNotifications() {
            document.getElementById('notificationsModal').classList.remove('active');
        }

        function renderNotifications() {
            const notifications = getNotifications();
            const content = document.getElementById('notificationsContent');

            if (notifications.length === 0) {
                content.innerHTML = `
                    <div style="text-align:center;color:#666;padding:40px;">
                        <i class="fas fa-bell" style="font-size:40px;opacity:0.3;"></i>
                        <p style="margin-top:10px;font-size:14px;">No notifications yet</p>
                    </div>
                `;
                return;
            }

            content.innerHTML = notifications.slice(0, 50).map(n => `
                <div class="notification-item">
                    <div class="notif-icon">
                        ${n.type === 'liked' ? '❤️' : n.type === 'followed' ? '🤝' : '💬'}
                    </div>
                    <div class="notif-text">
                        <strong>@${n.username}</strong> ${n.message}
                    </div>
                    <div class="notif-time">${timeAgo(new Date(n.timestamp))}</div>
                </div>
            `).join('');
        }

        // ===== TIME AGO =====
        function timeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + 'm ago';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h ago';
            const days = Math.floor(hours / 24);
            if (days < 7) return days + 'd ago';
            return date.toLocaleDateString();
        }

        // ===== TOAST =====
        let toastTimeout = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeUploadModal();
                closeCommentsModal();
                closeProfile();
                closeSearch();
                closeInbox();
                closeNotifications();
            }
            if (e.key === 'u' && !e.ctrlKey && !e.metaKey) {
                openUploadModal();
            }
            if (e.key === 'Enter' && document.getElementById('commentsModal').classList.contains('active')) {
                if (document.activeElement === document.getElementById('commentInput')) {
                    postComment();
                }
            }
        });

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();

            // Close modals on overlay click
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) {
                        modal.classList.remove('active');
                    }
                });
            });

            // Reset auth form on load
            document.getElementById('authName').value = '';
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';

            console.log('🎬 MudassirTok v2.0 Loaded!');
            console.log('👤 Current user:', currentUser);
            console.log('📹 Total videos:', DB.getVideos().length);
            console.log('👥 Total users:', DB.getUsers().length);
            console.log('💬 Total comments:', Object.keys(DB.getComments()).length);
            console.log('❤️ Total likes:', Object.keys(DB.getLikes()).length);
            console.log('🤝 Total follows:', Object.keys(DB.getFollows()).length);
        });
    </script>

</body>
</html>
